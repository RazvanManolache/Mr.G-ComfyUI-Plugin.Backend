name: Plugin package and ComfyUI checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7.1.0
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Fetch pinned legacy ComfyUI source
        # This historical tree contains an unrelated orphan temp_repo gitlink.
        # Plain Git checks out the source without checkout-action submodule cleanup.
      run: |
        git init -b ci .comfy
        git -C .comfy remote add origin https://github.com/RazvanManolache/Mr.G-ComfyUI.git
        git -C .comfy fetch --depth 1 origin 96f117e9abf9830d3efdc32604581ff67b205858
        git -C .comfy checkout --detach FETCH_HEAD
    - name: Check out web plugin
      uses: actions/checkout@v7.0.1
      with:
        repository: RazvanManolache/Mr.G-ComfyUI-Plugin.Web
        ref: de0248d9635bc5d583321cacf8f6f67ea24637a5
        path: .frontend/mrg
        persist-credentials: false
    - name: Install CPU test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -r .comfy/requirements.txt -r requirements.txt 'transformers==4.49.0' 'numpy<2'
        python -m pip check
    - name: Check plugin and package tracked runtime files
      run: |
        python -W error::SyntaxWarning tools/check.py
        python tools/package.py
    - name: Test extracted package in real ComfyUI
      run: python tools/smoke_comfy.py
    - uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: ComfyUI-Backend-plugin
        BUILD_PATHS: dist/*
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: error
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    permissions:
      contents: write

name: Plugin package and ComfyUI checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check out matching ComfyUI fork
        uses: actions/checkout@v7.0.1
        with:
          repository: RazvanManolache/Mr.G-ComfyUI
          ref: 96f117e9abf9830d3efdc32604581ff67b205858
          path: .comfy
          persist-credentials: false
      - name: Check out web plugin
        uses: actions/checkout@v7.0.1
        with:
          repository: RazvanManolache/Mr.G-ComfyUI-Plugin.Web
          ref: 8e96479
          path: .frontend/mrg
          persist-credentials: false
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.6.0 torchvision==0.21.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r .comfy/requirements.txt -r requirements.txt 'transformers==4.49.0' 'numpy<2'
          python -m pip check
      - name: Check plugin and package tracked runtime files
        run: |
          python -W error::SyntaxWarning tools/check.py
          python tools/package.py
      - name: Test extracted package in real ComfyUI
        run: python tools/smoke_comfy.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ComfyUI-Backend-plugin
          path: dist/*
          if-no-files-found: error
          retention-days: 30
